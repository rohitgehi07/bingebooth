<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ t('brand_name') }} — Ultimate Movie Ticket Booking{% endblock %}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bingeDark: 'var(--bg-main)',
            bingeSurface: 'var(--surface-card)',
            bingeElevated: 'var(--surface-elevated)',
            bingeViolet: '#7C3AED',
            bingeMagenta: '#EC4899',
            bingeAmber: '#F59E0B',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- HTML2Canvas & QRCode CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Theme Script (Light Mode Default) -->
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-bingeDark text-gray-900 dark:text-gray-100 flex flex-col min-h-screen selection:bg-purple-600 selection:text-white transition-colors duration-300">

  <!-- Navbar -->
  {% include 'partials/navbar.html' %}

  <!-- Toast Notifications -->
  {% include 'partials/toast.html' %}

  <!-- Main Content Container -->
  <main class="flex-grow">
    {% block content %}{% endblock %}
  </main>

  <!-- Floating Bingyy Chatbot -->
  {% include 'partials/chatbot.html' %}

  <!-- Footer -->
  {% include 'partials/footer.html' %}

  <!-- JavaScript Assets -->
  <script src="{{ url_for('static', filename='js/location.js') }}"></script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
