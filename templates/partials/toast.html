<!-- Toast Flash Notification Partial -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="fixed top-20 right-6 z-50 flex flex-col gap-2 max-w-sm w-full" x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)">
      {% for category, message in messages %}
        <div class="flex items-center gap-3 p-4 rounded-2xl shadow-2xl border text-xs font-medium backdrop-blur-md transition-all animate-bounce-once
                    {% if category == 'error' %} bg-red-950/90 border-red-700 text-red-200
                    {% elif category == 'success' %} bg-emerald-950/90 border-emerald-700 text-emerald-200
                    {% elif category == 'warning' %} bg-amber-950/90 border-amber-700 text-amber-200
                    {% else %} bg-purple-950/90 border-purple-700 text-purple-200 {% endif %}">
          
          <div class="text-base flex-shrink-0">
            {% if category == 'error' %}❌
            {% elif category == 'success' %}✅
            {% elif category == 'warning' %}⚠️
            {% else %}ℹ️{% endif %}
          </div>
          
          <div class="flex-1">{{ message }}</div>
          
          <button @click="show = false" class="opacity-70 hover:opacity-100 p-1">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
